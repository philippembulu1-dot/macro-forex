name: Audit du site en ligne
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/site_audit.js", ".github/workflows/site-audit.yml"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p audit-out && node scripts/site_audit.js | tee audit-out/rapport.txt
        env: { SITE: "https://philippembulu1-dot.github.io/macro-forex/" }
      - name: Rapport dans la branche audit-rapport
        if: always()
        run: |
          cd audit-out
          git init -q -b audit-rapport
          git config user.name "macro-forex-robot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Audit du site en ligne"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit-rapport
