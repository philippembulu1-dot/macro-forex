name: Test historique de la stratégie or
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/strategy_analysis.py"
      - ".github/workflows/strategy-analysis.yml"
permissions:
  contents: write
concurrency:
  group: strategy-analysis
  cancel-in-progress: false
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Calculer
        env:
          PYTHONUNBUFFERED: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/strategy_analysis.py
      - name: Publier
        run: |
          git config user.name "macro-forex-robot"
          git config user.email "actions@users.noreply.github.com"
          cp data/strategy-analysis.json /tmp/sa.json
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/sa.json data/strategy-analysis.json
            git add data/strategy-analysis.json
            if git diff --staged --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -q -m "Test historique de la stratégie or"
            if git push -q origin HEAD:main; then echo "Publié"; exit 0; fi
            sleep 7
          done
          exit 1
