name: Mise à jour des données
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les données
        env:
          PYTHONUNBUFFERED: "1"
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: python scripts/update_data.py
      - name: Publier si changé
        run: |
          git config user.name "macro-forex-robot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp data/macro.json data/seasonal.json /tmp/out/ && for f in macro-history surprises; do cp data/$f.json /tmp/out/ 2>/dev/null || true; done
          for i in 1 2 3; do
            # On repart de la dernière version du dépôt et on y pose les nouvelles données (évite les conflits entre deux passages du robot)
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/out/*.json data/
            git add data/macro.json data/seasonal.json $( [ -f data/macro-history.json ] && echo data/macro-history.json ) $( [ -f data/surprises.json ] && echo data/surprises.json )
            if git diff --staged --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -q -m "Données mises à jour"
            if git push -q origin HEAD:main; then echo "Publié"; exit 0; fi
            echo "Envoi refusé, nouvel essai ($i)"; sleep 5
          done
          exit 1
