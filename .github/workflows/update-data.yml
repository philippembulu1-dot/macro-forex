name: Mise à jour des données
on:
  schedule:
    - cron: "2,32 * * * *"  # GitHub retarde ou saute des passages (≈ 1 par heure en pratique) : chaque passage tourne donc en boucle ~1 h
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"
permissions:
  contents: write
  actions: write  # relancer la boucle suivante (workflow_dispatch est autorisé avec le jeton du robot)
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lecteur de fichiers Excel (indice géopolitique GPR)
        run: |
          pip install --quiet xlrd==2.0.1 || echo "xlrd indisponible, l'indice GPR sera noté en échec"
      - name: Récupérer et publier les données toutes les 12 minutes pendant environ 1 heure
        env:
          PYTHONUNBUFFERED: "1"
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          CYCLES: ${{ github.event_name == 'push' && '1' || '5' }}
          MF_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "macro-forex-robot"
          git config user.email "actions@users.noreply.github.com"
          publish() {
            mkdir -p /tmp/out && rm -f /tmp/out/*.json && cp data/macro.json data/seasonal.json /tmp/out/ && for f in macro-history surprises reactions gold-etf geo-history acces; do cp data/$f.json /tmp/out/ 2>/dev/null || true; done
            for i in 1 2 3; do
              # On repart de la dernière version du dépôt et on y pose les nouvelles données (évite les conflits entre deux passages)
              git fetch -q origin main && git reset -q --hard origin/main
              cp /tmp/out/*.json data/
              git add data/*.json
              if git diff --staged --quiet; then echo "Rien de nouveau"; return 0; fi
              git commit -q -m "Données mises à jour"
              if git push -q origin HEAD:main; then echo "Publié"; return 0; fi
              echo "Envoi refusé, nouvel essai ($i)"; sleep 5
            done
            return 1
          }
          ok=0
          wd0=$(date -u +%u); hh0=$(date -u +%H)
          if [ "$CYCLES" -gt 1 ] && { [ "$wd0" = 6 ] || { [ "$wd0" = 7 ] && [ "$hh0" -lt 20 ]; } || { [ "$wd0" = 5 ] && [ "$hh0" -ge 22 ]; }; }; then CYCLES=2; fi  # week-end : 2 passages espacés de 30 min par boucle
          for c in $(seq 1 $CYCLES); do
            start=$(date +%s)
            echo "=== Passage $c / $CYCLES : $(date -u +%H:%M) UTC"
            # le robot part de la dernière version publiée (mémoires et historiques à jour)
            git fetch -q origin main && git reset -q --hard origin/main
            if python scripts/update_data.py && publish; then ok=1; else echo "Passage $c en échec"; fi
            # Semaine : un passage toutes les 12 min. Week-end (marchés fermés) : toutes les 30 min.
            wd=$(date -u +%u); hh=$(date -u +%H); gap=720
            if [ "$wd" = 6 ] || { [ "$wd" = 7 ] && [ "$hh" -lt 21 ]; } || { [ "$wd" = 5 ] && [ "$hh" -ge 22 ]; }; then gap=1800; fi
            [ "$CYCLES" -gt 1 ] && sleep $(( gap - ($(date +%s) - start) > 30 ? gap - ($(date +%s) - start) : 30 ))
          done
          # Chaîne : en fin de boucle, on relance le robot tout de suite (sans attendre l'horaire GitHub, souvent en retard).
          # Le groupe « concurrency » garde au plus un passage en attente : pas d'emballement possible.
          if [ "$CYCLES" -gt 1 ]; then gh workflow run update-data.yml --ref main -R "$GITHUB_REPOSITORY" && echo "Boucle suivante lancée" || echo "Relance impossible : l'horaire GitHub prendra le relais"; fi
          [ $ok = 1 ]
